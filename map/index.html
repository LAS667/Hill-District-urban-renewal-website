<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress over People in Pittsburgh</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: Georgia, 'Times New Roman', serif; background: #e8dfc8; }
    #map { height: 100%; width: 100%; background: #e8dfc8; }
    /* a soft, aged-paper wash over the map, so the places stand out */
    .leaflet-tile-pane { filter: sepia(0.55) saturate(0.7) contrast(0.95) brightness(1.04); }

    .title-card { position: absolute; top: 16px; left: 16px; z-index: 1000; background: #fbf3e0; color: #3b2a18; padding: 16px 20px;
      border-radius: 4px; max-width: 340px; border: 1px solid #d8c28f; border-left: 6px solid #8b1e1e; box-shadow: 0 2px 14px rgba(60,40,20,0.35); }
    .title-card h1 { margin: 0 0 6px; font-size: 1.3rem; color: #6b1414; line-height: 1.2; }
    .title-card p { margin: 0 0 8px; font-size: 0.88rem; color: #4a3a22; line-height: 1.45; }
    .title-card .note { margin: 0; font-size: 0.78rem; color: #7a6646; font-style: italic; }
    .notice { position: absolute; top: 18px; right: 16px; z-index: 1000; background: #fff3cd; border: 1px solid #e0c36a;
      padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; max-width: 320px; font-family: system-ui, sans-serif; }
    .notice[hidden] { display: none; }

    .leaflet-popup-content-wrapper { background: #fbf3e0; color: #3b2a18; border-radius: 5px; box-shadow: 0 3px 16px rgba(60,40,20,0.4); padding: 0; overflow: hidden; }
    .leaflet-popup-content { margin: 0; width: 250px !important; }
    .leaflet-popup-tip { background: #fbf3e0; }
    .pop .hdr { padding: 10px 14px; color: #fff; }
    .pop .hdr.main { background: #8b1e1e; } .pop .hdr.within { background: #b5622a; } .pop .hdr.connected { background: #2f6d74; }
    .pop .hdr.street { background: #5a5a5a; } .pop .hdr.area { background: #7a6646; }
    .pop .name { font-size: 1.05rem; font-weight: 700; line-height: 1.25; }
    .pop .date { font-family: system-ui, sans-serif; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.9; margin-top: 3px; }
    .pop .body { padding: 12px 14px; }
    .pop .desc { font-size: 0.9rem; line-height: 1.5; }
    .pop .meta { font-family: system-ui, sans-serif; font-size: 0.74rem; color: #7a6646; border-top: 1px solid #e3d3a8; margin-top: 10px; padding-top: 8px; }
    .pop .meta div { margin: 2px 0; }

    .legend { background: #fbf3e0; color: #4a3a22; padding: 12px 16px; border-radius: 4px; font-size: 0.82rem; line-height: 1.5;
      border: 1px solid #d8c28f; box-shadow: 0 2px 14px rgba(60,40,20,0.35); max-width: 270px; }
    .legend h2 { margin: 0 0 6px; font-size: 0.9rem; color: #6b1414; }
    .legend div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .place-label { background: transparent; border: none; box-shadow: none; font-size: 11px; font-weight: 700; color: #3b2a18;
      text-shadow: 0 0 3px #fbf3e0, 0 0 3px #fbf3e0, 0 0 4px #fbf3e0; }
    .leaflet-bar a { background: #fbf3e0; color: #4a3a22; }
    @keyframes flow { to { stroke-dashoffset: -1000; } }
    .flow-line { stroke-dasharray: 8 12; animation: flow 30s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .flow-line { animation: none; } }
    @media (max-width: 600px) { .title-card { right: 16px; max-width: none; } .legend { font-size: 0.75rem; max-width: 210px; } }
  </style>
</head>
<body>
  <!-- EDIT: change the title and the lines below to your own words -->
  <div class="title-card">
    <h1>Progress over People in Pittsburgh</h1>
    <p>How urban renewal and redlining changed Pittsburgh's Hill District, and what it meant for the people who lived there.</p>
    <p class="note">Click a place to read about it. Locations are approximate.</p>
  </div>
  <div class="notice" id="notice" hidden></div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  // ===============================================================
  // SETTINGS
  // ===============================================================
  var COLORS = { main: "#8b1e1e", within: "#b5622a", connected: "#2f6d74", gold: "#d99a00", area: "#8b1e1e", street: "#4a4a4a", lost: "#8b1e1e" };
  var FALLBACK_VIEW = [40.4483, -79.9740, 14];   // centre of the Hill District, used if no data is found

  // ===============================================================
  // MAP (standard OpenStreetMap background: no account or key needed)
  // ===============================================================
  var map = L.map("map");
  var osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
  // If the standard map keeps failing to load, switch to this backup map by itself.
  var backup = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", { subdomains: "abcd", maxZoom: 20,
    attribution: "&copy; OpenStreetMap contributors &copy; CARTO" });
  var tileErrors = 0;
  osm.on("tileerror", function () { tileErrors++; if (tileErrors === 6 && map.hasLayer(osm)) { map.removeLayer(osm); backup.addTo(map); } });
  map.setView([FALLBACK_VIEW[0], FALLBACK_VIEW[1]], FALLBACK_VIEW[2]);

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function clean(v) { return (v === null || v === undefined) ? "" : String(v).trim(); }

  // The popup. The description is shown as written, so a photo can be added to it with an img tag, as in the class guide.
  function popupHtml(p, kind) {
    var date = clean(p.Date), src = clean(p.Source), cert = clean(p.Certainty);
    var meta = (src ? "<div>Source: " + esc(src) + "</div>" : "") + (cert ? "<div>Location: " + esc(cert) + "</div>" : "");
    return '<div class="pop"><div class="hdr ' + kind + '"><div class="name">' + esc(clean(p.Name) || "Untitled") + "</div>" +
      (date ? '<div class="date">' + esc(date) + "</div>" : "") + '</div><div class="body">' +
      '<div class="desc">' + clean(p.Description) + "</div>" + (meta ? '<div class="meta">' + meta + "</div>" : "") + "</div></div>";
  }

  // ===============================================================
  // BUILD THE MAP FROM THE THREE FILES
  // ===============================================================
  var allBounds = null, mainPoint = null, connected = [], count = 0;
  function extend(b) { if (b && b.isValid()) { allBounds = allBounds ? allBounds.extend(b) : L.latLngBounds(b.getSouthWest(), b.getNorthEast()); } }

  function addPolygons(data) {
    (data.features || []).forEach(function (f) {
      if (!f.geometry) return; count++;
      var p = f.properties || {}, g = clean(p.Group).toLowerCase(), approx = /yes|true/i.test(clean(p.Approximate));
      var color = /zon/.test(g) ? "#222222" : COLORS.area;
      var style = { color: color, weight: approx ? 2.5 : 3, dashArray: approx ? "3 7" : (/redlin|holc/.test(g) ? "10 6" : null), fillColor: color, fillOpacity: /zon/.test(g) ? 0 : 0.14 };
      var lyr = L.geoJSON(f, { style: style }).bindPopup(popupHtml(p, "area")).bindTooltip(esc(clean(p.Name) || "Area"), { sticky: true }).addTo(map);
      extend(lyr.getBounds());
    });
  }
  function addLines(data) {
    (data.features || []).forEach(function (f) {
      if (!f.geometry) return; count++;
      var p = f.properties || {}, lost = /lost|demolish/i.test(clean(p.Group) + " " + clean(p.Status));
      var style = lost ? { color: COLORS.lost, weight: 5, dashArray: "2 9", lineCap: "round" } : { color: COLORS.street, weight: 4 };
      var lyr = L.geoJSON(f, { style: style }).bindPopup(popupHtml(p, "street")).bindTooltip(esc(clean(p.Name) || "Street"), { sticky: true }).addTo(map);
      extend(lyr.getBounds());
    });
  }
  function addPoints(data) {
    (data.features || []).forEach(function (f) {
      if (!f.geometry || f.geometry.type !== "Point") return; count++;
      var p = f.properties || {}, typ = clean(p.Type || p.type).toLowerCase();
      var isMain = /yes|true/i.test(clean(p.Main)) || /\bMAIN\b/.test(clean(p.Description)), isConn = typ === "connected";
      var kind = isMain ? "main" : (isConn ? "connected" : "within");
      var lyr = L.geoJSON(f, { pointToLayer: function (feat, ll) {
        return L.circleMarker(ll, { radius: isMain ? 14 : 8, fillColor: COLORS[kind], color: "#fbf3e0", weight: isMain ? 4 : 2, fillOpacity: 0.95 });
      } }).bindPopup(popupHtml(p, kind), { maxWidth: 260 }).bindTooltip(esc(clean(p.Name) || "Place"), { direction: "right", className: "place-label", offset: [10, 0] }).addTo(map);
      var ll = L.latLng(f.geometry.coordinates[1], f.geometry.coordinates[0]);
      extend(L.latLngBounds([ll, ll]));
      if (isMain) mainPoint = ll; else if (isConn) connected.push({ ll: ll, name: clean(p.Name) });
    });
  }
  function addConnections() {
    if (!mainPoint) return;
    connected.forEach(function (c) {
      L.polyline([mainPoint, c.ll], { color: COLORS.gold, weight: 3, opacity: 0.9, className: "flow-line" })
        .bindTooltip(esc("From the main place to " + c.name), { sticky: true }).addTo(map);
    });
  }

  function load(file) { return fetch(file).then(function (r) { if (!r.ok) throw new Error(file + " " + r.status); return r.json(); }); }
  Promise.allSettled([load("polygons.geojson"), load("lines.geojson"), load("points.geojson")]).then(function (res) {
    var names = ["polygons.geojson", "lines.geojson", "points.geojson"], missing = [];
    if (res[0].status === "fulfilled") addPolygons(res[0].value); else missing.push(names[0]);
    if (res[1].status === "fulfilled") addLines(res[1].value); else missing.push(names[1]);
    if (res[2].status === "fulfilled") addPoints(res[2].value); else missing.push(names[2]);
    addConnections();
    var n = document.getElementById("notice");
    if (missing.length) { n.textContent = "These files could not be loaded: " + missing.join(", ") + ". Check their names and that they are in the same folder as index.html."; n.hidden = false; }
    else if (!count) { n.textContent = "The files loaded but contain no places yet. Add your places and refresh."; n.hidden = false; }
    if (allBounds) map.fitBounds(allBounds, { padding: [60, 60] });
  });

  // ===============================================================
  // KEY
  // ===============================================================
  var legend = L.control({ position: "bottomleft" });
  legend.onAdd = function () {
    var div = L.DomUtil.create("div", "legend");
    function dot(c, r) { return '<svg width="30" height="22" aria-hidden="true"><circle cx="15" cy="11" r="' + r + '" fill="' + c + '" stroke="#fbf3e0" stroke-width="2"/></svg>'; }
    div.innerHTML = "<h2>Key</h2>" +
      "<div>" + dot(COLORS.main, 9) + "Main place</div>" +
      "<div>" + dot(COLORS.within, 6) + "Place in the Hill District</div>" +
      "<div>" + dot(COLORS.connected, 6) + "Connected place</div>" +
      '<div><svg width="30" height="12" aria-hidden="true"><line x1="1" y1="6" x2="29" y2="6" stroke="' + COLORS.gold + '" stroke-width="3" stroke-dasharray="8 5"/></svg>Link to the main place</div>' +
      '<div><svg width="30" height="12" aria-hidden="true"><line x1="1" y1="6" x2="29" y2="6" stroke="' + COLORS.street + '" stroke-width="4"/></svg>Street that still exists</div>' +
      '<div><svg width="30" height="14" aria-hidden="true"><rect x="1" y="2" width="28" height="10" fill="' + COLORS.area + '" fill-opacity="0.14" stroke="' + COLORS.area + '" stroke-width="2" stroke-dasharray="3 5"/></svg>Approximate area</div>';
    L.DomEvent.disableClickPropagation(div); return div;
  };
  legend.addTo(map);
  </script>
</body>
</html>
